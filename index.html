
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRIDAY AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;background:radial-gradient(circle,#092b54,#020814 70%);
 color:#fff;font-family:Arial,sans-serif;display:flex;
 align-items:center;justify-content:center;text-align:center;
}
main{width:100%;padding:25px}
h1{color:#42c8ff;letter-spacing:5px;text-shadow:0 0 20px #009dff}
.orb{
 width:190px;height:190px;border:3px solid #27baff;border-radius:50%;
 margin:35px auto;display:grid;place-items:center;
 box-shadow:0 0 25px #008cff,inset 0 0 30px #008cff;
 animation:pulse 2s infinite;
}
.orb span{font-size:55px;color:#70dcff}
@keyframes pulse{50%{box-shadow:0 0 50px #00aaff,inset 0 0 45px #008cff}}
nav{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
a{color:#8edfff;border:1px solid #168dce;padding:13px 18px;
 border-radius:12px;text-decoration:none;background:#071b32}
p{color:#a9d9f2}
</style>
</head>
<body>
<main>
<h1>FRIDAY AI</h1>
<p>YOUR PERSONAL AI ASSISTANT</p>
<div class="orb"><span>F</span></div>
<p>WELCOME BACK</p>
<nav>
<a href="https://www.google.com/maps">Maps</a>
<a href="https://photos.google.com">Gallery</a>
<a href="#settings">Settings</a>
</nav>
<p id="settings">FRIDAY SYSTEM ONLINE</p>
</main>
</body>
</html>
